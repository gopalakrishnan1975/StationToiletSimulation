services:
  api:
    build: .
    ports: ["8000:8000"]
  dashboard:
    build: .
    command: ["streamlit", "run", "dashboard.py", "--server.address", "0.0.0.0", "--server.port", "8501"]
    ports: ["8501:8501"]
  data-api:
    profiles: ["data"]
    build: .
    command: ["uvicorn", "data_api:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      DATA_API_TOKEN: ${DATA_API_TOKEN:-}
    ports: ["8001:8001"]
