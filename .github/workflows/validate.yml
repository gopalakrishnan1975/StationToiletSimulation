name: Test and refresh technical documentation
on:
  push:
    branches: [main]
    paths-ignore: ['docs/generated/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'push' && github.ref || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/build_docs.py
      - name: Refresh generated docs after successful main-branch tests
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git add docs/generated
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Refresh tested technical documentation [skip ci]'
            git push origin HEAD:main
          fi
